<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>7 Rezepte</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="app-header">
    <h1 class="app-title">7Rezepte</h1>
  </header>

  <main class="app">
    <div class="content">
      <div id="recipes-list" class="recipes-list"></div>
      <p id="recipes-loading" class="recipes-loading hidden">Lade…</p>
      <p id="recipes-error" class="recipes-error hidden" role="alert"></p>
    </div>
  </main>

  <footer class="footer">
    <button type="button" id="btn-generate" class="btn">Generieren</button>
  </footer>

  <div id="recipe-modal" class="recipe-modal hidden" role="dialog" aria-modal="true" aria-labelledby="recipe-modal-title" aria-hidden="true">
    <button type="button" class="recipe-modal-backdrop" aria-label="Schließen"></button>
    <div class="recipe-modal-panel">
      <button type="button" id="recipe-modal-close" class="recipe-modal-close" aria-label="Schließen">×</button>
      <p id="recipe-modal-loading" class="recipe-modal-loading hidden">Lade…</p>
      <div id="recipe-modal-content" class="hidden">
        <img id="recipe-modal-image" class="recipe-modal-image" alt="">
        <h2 id="recipe-modal-title" class="recipe-modal-title"></h2>
        <p id="recipe-modal-meta" class="recipe-modal-meta"></p>
        <h3 class="recipe-modal-section">Zutaten</h3>
        <ul id="recipe-modal-ingredients" class="recipe-modal-ingredients"></ul>
        <h3 class="recipe-modal-section">Zubereitung</h3>
        <p id="recipe-modal-instructions" class="recipe-modal-instructions"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
